[project]
name = "rl-tsc-2025"
version = "0.1.0"
description = ""
authors = [
    {name = "Ilai Dabush",email = "ilai.dabush@gmail.com"},
    {name = "Moshe Butman", email = "moshe.butman@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10"
packages = [{ include = "rltsc" }]
dependencies = [
    "sumo-rl (==1.4.5)",
    "stable-baselines3[extra] (>=2.0.0a9)",
    "libsumo (>=1.21.0,<2.0.0)",
    "ray[rllib] (>=2.44.1,<3.0.0)",
    "ray[rllib] (>=2.40.0,<3.0.0)",
    "lz4 (>=4.3.3,<5.0.0)",
    "matplotlib (>=3.10.0,<4.0.0)",
    "gymnasium (>=1.0.0,<2.0.0)",
    "pydantic (>=2.10.5,<3.0.0)",
    "xmltodict (>=0.14.2,<0.15.0)",
    "types-xmltodict (>=0.14.0.20241009,<0.15.0.0)",
    "pandas-stubs (>=2.2.3.250308,<3.0.0.0)",
    "pyyaml (>=6.0.2,<7.0.0)",
    "grpcio (>=1.71.0,<2.0.0)",
    "gputil (>=1.4.0,<2.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
ruff = "^0.9.1"
black = "^24.10.0"
mypy = "^1.15.0"
tensorboard = "^2.19.0"

